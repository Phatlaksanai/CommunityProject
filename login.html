<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temu Login</title>
<link rel="stylesheet" href="Login.css">
</head>
<body>
    <div class="login-container">
        <div class="left-panel">
            <h1>Temu</h1>
            <p>Welcome to Temu community<br>There is a lot of fun !!!!</p>
        </div>
        <div class="right-panel">
            <h2>Login</h2>
            <form>
                <label for="username">Username</label>
                <input type="text" id="username">

                <label for="password">Password</label>
                <input type="password" id="password">

                <a href="#" class="forgot">forgot password</a>

                <div class="btns">
                    <a href="/register"></a><button type="submit" class="create">create</button></a>
                    <a href="/index"><button type="submit" class="login-btn">login</button></a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
