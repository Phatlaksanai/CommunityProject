<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>3D Viewer</h1>
<a href="index.html"><button>back</button></a>

<!-- core three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- loaders -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<script>
/* ================= Renderer ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ================= Scene ================= */
const scene = new THREE.Scene();

/* ================= Camera ================= */
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

/* ================= Lights (ของเดิมคุณ) ================= */
scene.add(new THREE.AmbientLight(0x454040));

function createSpot(x, y, z, intensity = 5) {
    const light = new THREE.SpotLight(0xffffff, intensity);
    light.angle = Math.PI / 5;
    light.position.set(x, y, z);
    light.target.position.set(0, 0, 0);
    light.castShadow = true;
    light.distance = 10;
    scene.add(light);
    scene.add(light.target);
}

createSpot( 4.3, 0.6,  4.3);
createSpot(-4.3, 0.6,  4.3);
createSpot( 4.3, 0.6, -4.3);
createSpot(-4.3, 0.6, -4.3);
createSpot( 0,   5,    0, 0.7);

/* ================= Environment ================= */
const cubeUrls = [
    'https://threejs.org/examples/textures/cube/Bridge2/posx.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/negx.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/posy.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/negy.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/posz.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/negz.jpg'
];
const envMap = new THREE.CubeTextureLoader().load(cubeUrls);
envMap.encoding = THREE.sRGBEncoding;
scene.environment = envMap;

/* ================= Floor ================= */
const floorMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    metalness: 0.4,
    roughness: 0.2
});
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    floorMat
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ================= Model Group ================= */
const objectGroup = new THREE.Group();
scene.add(objectGroup);

/* ================= Utils ================= */
function setupModel(model) {
    model.traverse(child => {
        if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
        }
    });

    model.position.set(0, 0, 0);
    model.rotation.set(0, 0, 0);

    objectGroup.add(model);
}

/* ================= Loader Selector ================= */
function loadModelFromURL(url) {
    objectGroup.clear();

    const ext = url.split('.').pop().toLowerCase();

    if (ext === 'glb' || ext === 'gltf') {
        const loader = new THREE.GLTFLoader();
        loader.load(url, gltf => setupModel(gltf.scene));

    } else if (ext === 'fbx') {
        const loader = new THREE.FBXLoader();
        loader.load(url, object => setupModel(object));

    } else if (ext === 'obj') {
        const loader = new THREE.OBJLoader();
        loader.load(url, object => setupModel(object));

    } else if (ext === 'stl') {
        const loader = new THREE.STLLoader();
        loader.load(url, geometry => {
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const mesh = new THREE.Mesh(geometry, mat);
            setupModel(mesh);
        });

    } else {
        alert('ไฟล์นี้ยังไม่รองรับ');
    }
}

/* ================= Example: Load from DB ================= */
const modelUrlFromDB =
"https://res.cloudinary.com/dcjjglgoj/image/upload/v1767167830/Cloudinary%203D/models/sni3_ftkwrt.glb";

loadModelFromURL(modelUrlFromDB);

/* ================= Animate ================= */
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

/* ================= Resize ================= */
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
